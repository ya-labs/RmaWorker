name: Build and Push RMA Backend Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "RmaWorker/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-rma-backend-aca.yml"

env:
  IMAGE_NAME: rma-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          IMAGE_LATEST=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

          docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
          docker push $IMAGE_TAG
          docker push $IMAGE_LATEST

          echo "Image pushed:"
          echo "$IMAGE_TAG"
          echo "$IMAGE_LATEST"
