name: Deploy RMA Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "RmaWorker/**"
      - "RMIA.sln"
      - ".github/workflows/build-rma-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish RmaWorker/RmaWorker.csproj --configuration Release --runtime linux-x64 --self-contained false -p:UseAppHost=false --output publish/rma-backend

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RMA_VM_SSH_KEY }}" > ~/.ssh/rma_vm_key
          chmod 600 ~/.ssh/rma_vm_key
          ssh-keyscan -H "${{ secrets.RMA_VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload backend
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/rma_vm_key" publish/rma-backend/ ${{ secrets.RMA_VM_USER }}@${{ secrets.RMA_VM_HOST }}:/home/azureuser/rma-backend/

      - name: Restart service
        run: |
          ssh -i ~/.ssh/rma_vm_key ${{ secrets.RMA_VM_USER }}@${{ secrets.RMA_VM_HOST }} "sudo systemctl restart rma-worker"

      - name: Health check
        run: |
          curl --fail --retry 5 --retry-delay 3 "${{ secrets.RMA_API_BASE_URL }}/api/health"
